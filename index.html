<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081711">
<title>BTC GAS Feuille de marque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Un seul univers : stand de tir au crépuscule. Vert nuit, plateau orange, chiffres de tableau d'affichage. Colonne téléphone 560px. */
  color-scheme:dark;
  --bg:#040a08; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.10); --ink:#f5f7f2; --muted:#9dada4; --line:rgba(255,255,255,.13);
  --accent:#ff6a1f; --accent2:#ffa24a; --on-accent:#1b0d04;
  --ok:#35d07f; --mid:#ffc247; --ko:#ff5d52; --on-sem:#06140e;
  --accent-ink:#ffa24a; --ok-ink:#35d07f; --bar:rgba(4,10,8,.55); --field:rgba(255,255,255,.07); --panel:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04)); --panel-line:rgba(255,255,255,.2); --shadow:rgba(0,0,0,.5); --aur:1;
  --display:"Unbounded","Arial Black",Arial,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.clair{
  color-scheme:light;
  --bg:#f2f3ee; --surface:rgba(255,255,255,.62); --surface2:rgba(255,255,255,.92); --ink:#0c1f17; --muted:#55695d; --line:rgba(12,31,23,.13);
  --accent:#f05a0f; --accent2:#ff8a3d; --on-accent:#1b0d04;
  --ok:#2fbf74; --mid:#f5b82e; --ko:#f0584d; --on-sem:#08160f;
  --accent-ink:#c2470a; --ok-ink:#14804a; --bar:rgba(242,243,238,.6); --field:#ffffff; --panel:linear-gradient(150deg,rgba(255,255,255,.96),rgba(255,255,255,.55)); --panel-line:rgba(12,31,23,.14); --shadow:rgba(20,50,35,.14); --aur:.5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 420px at 85% -80px,rgba(255,106,31,.20),transparent 70%),radial-gradient(700px 500px at -10% 30%,rgba(53,208,127,.07),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:18px}
header.bar{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 16px 10px;margin:0 -16px;border-bottom:1px solid var(--line)}
header.bar h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0;flex:1;letter-spacing:.5px;text-transform:uppercase}
header.bar button{min-height:40px;padding:6px 12px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.8px}
.pill.on{color:var(--ok-ink);border-color:rgba(53,208,127,.6)}
.pill.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok)}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.8px;text-wrap:balance;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:14px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 2px 0 #b8400a}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px var(--shadow)}
button{font:inherit;color:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--surface2);padding:12px 16px;font-weight:600;min-height:52px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
button.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--on-accent);border:none;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:1px;text-transform:uppercase;box-shadow:0 8px 24px rgba(255,106,31,.35),inset 0 1px 0 rgba(255,255,255,.35)}
button.ghost{background:transparent}
button.link{border:none;background:none;padding:6px 4px;min-height:36px;color:var(--muted);text-decoration:underline;font-weight:500}
button:disabled{opacity:.4;cursor:default}
/* accueil */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#1d4a3a 0%,#12352a 55%,#0b241b 100%);border:1px solid #2f5a49;color:#f3f6ee;border-radius:22px;padding:24px 20px 20px;margin-top:16px;display:flex;flex-direction:column;gap:4px;aspect-ratio:400/230;justify-content:flex-end;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero.on3d svg{display:none}
.hero .wm{position:relative;font-family:var(--display);font-weight:900;font-size:84px;line-height:.82;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.hero .wm em{font-style:normal;color:var(--accent);display:block}
.hero .sub{position:relative;font-size:13px;font-weight:600;color:#cfe0d6;text-transform:uppercase;letter-spacing:2.5px;margin-top:8px}
.hero .pill{position:absolute;bottom:18px;right:16px;background:rgba(8,23,17,.45);color:#cfe0d6;border-color:rgba(255,255,255,.3)}
.hero .pill.on{color:#8fe3b3}
.disc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.disc button{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 14px 16px;text-align:left;border:1px solid var(--panel-line);background:var(--panel);border-radius:18px;box-shadow:0 10px 26px var(--shadow)}
.disc button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.disc svg{width:100%;height:auto;margin-bottom:6px}
.disc b{font-family:var(--display);font-weight:900;font-size:52px;line-height:.9;letter-spacing:1px}
.disc span{font-size:13.5px;font-weight:500;color:var(--muted);line-height:1.35}
input[type=text]{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:52px}
input[type=text]::placeholder{color:var(--muted);opacity:.75}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.slot{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.slot .n{font-family:var(--display);font-weight:800;font-size:24px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:2px solid var(--accent);color:var(--ink)}
.slot label.memo{grid-column:2;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:6px 14px;border-radius:99px;font-weight:500}
.err{color:var(--ko);font-weight:600}
/* tir */
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.postes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative;padding-top:4px}
.postes::before{content:"";position:absolute;left:10%;right:10%;top:26px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.po{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.po b{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--surface2);border:2px solid var(--line);color:var(--muted)}
.po span{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--muted)}
.po.vide b{border-style:dashed;background:transparent}
.po.act b{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:#ffd0a8;color:var(--on-accent);box-shadow:0 0 0 5px rgba(255,106,31,.22),0 6px 18px rgba(255,106,31,.45);transform:scale(1.12)}
.po.act span{color:var(--accent-ink)}
.now{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 14px 36px var(--shadow)}
.now::after{content:"";position:absolute;right:-26px;top:-18px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,162,74,.35),rgba(255,106,31,.08) 60%,transparent 70%)}
.now .poste{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--accent-ink);letter-spacing:1.5px}
.now .nom{font-family:var(--display);font-weight:900;font-size:58px;line-height:.98;overflow-wrap:anywhere;text-transform:uppercase;position:relative;z-index:1}
.now .ctx{color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.shots{display:flex;flex-direction:column;gap:10px}
.shots button{min-height:80px;font-size:21px;display:flex;justify-content:space-between;align-items:center;padding:0 22px 0 18px;border:none;color:var(--on-sem);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.3)}
.shots button span{display:flex;align-items:center;gap:12px;font-weight:600}
.shots button b{font-family:var(--display);font-weight:900;font-size:46px;line-height:1}
.s1{background:linear-gradient(180deg,#5fe39c,var(--ok))} .s2{background:linear-gradient(180deg,#ffd778,var(--mid))} .s0{background:linear-gradient(180deg,#ff8279,var(--ko))}
.carts{display:inline-flex;gap:4px;width:34px;justify-content:center}
.cart{width:12px;height:30px;border-radius:3px 3px 2px 2px;background:linear-gradient(180deg,#c22a1c 0 62%,#d9b24a 62% 100%);box-shadow:inset -2px 0 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.3)}
.miss{width:34px;height:30px;position:relative}
.miss::before,.miss::after{content:"";position:absolute;left:15px;top:0;width:4px;height:30px;border-radius:2px;background:var(--on-sem)}
.miss::before{transform:rotate(45deg)} .miss::after{transform:rotate(-45deg)}
.board{display:flex;flex-direction:column}
.board .l{display:grid;grid-template-columns:22px 1fr auto 52px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.board .l:last-child{border-bottom:none}
.board .l>span:first-child{color:var(--muted);font-weight:600}
.board .l.cur{font-weight:600}
.board .l.cur .nm{color:var(--accent-ink)}
.board .tot{font-family:var(--display);font-weight:800;font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
.marks{display:flex;gap:3px}
.m{width:24px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.18)}
.m.r1{background:var(--ok);color:var(--on-sem);border-color:var(--ok)}
.m.r2{background:var(--mid);color:var(--on-sem);border-color:var(--mid)}
.m.r0{background:transparent;color:var(--ko);border-color:var(--ko)}
/* resultat */
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.rank .rg{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:2px solid var(--line);color:var(--muted)}
.rank .sc{font-family:var(--display);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.rank .sc small{font-size:18px;color:var(--muted);font-weight:700}
.rank.first{background:linear-gradient(135deg,rgba(255,162,74,.22),rgba(255,106,31,.06));border:1px solid rgba(255,162,74,.55);border-radius:16px;padding:16px 14px;margin-bottom:4px}
.rank.first .rg{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:#ffd0a8;color:var(--on-accent);box-shadow:0 6px 18px rgba(255,106,31,.45)}
.rank.first b{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.5px}
.rank.first .sc{font-size:54px;color:var(--accent-ink)}
.grid5{display:grid;grid-template-columns:auto repeat(5,30px) 44px;gap:5px 5px;align-items:center;font-variant-numeric:tabular-nums}
.grid5 .lab{font-size:13px;color:var(--muted);padding-right:6px;white-space:nowrap}
.grid5 .st{text-align:right;font-weight:700}
.grid5 .m{width:30px;height:30px}
.edit .m{cursor:pointer;outline:2px dashed var(--accent2);outline-offset:1px}
.sheet{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.sheet img{display:block;height:auto;width:900px;max-width:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item button{min-height:42px;padding:6px 14px}
.item.col{flex-direction:column;align-items:stretch}
.item.col .row{justify-content:flex-start}
.item button.primary{font-size:18px;padding:6px 18px}
textarea{width:100%;min-height:150px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px}
@media (max-width:380px){.hero .wm{font-size:68px}.now .nom{font-size:46px}.disc b{font-size:44px}}
@media (prefers-reduced-motion:no-preference){
  button{transition:transform .08s ease}
  button:active{transform:scale(.97)}
  .hero .vol{animation:vol 1.1s cubic-bezier(.2,.7,.2,1) both}
  .hero .eclat{animation:eclat .5s 1s both}
  .now .nom{animation:entre .22s ease-out both}
  .po.act b{animation:pulse 1.8s ease-in-out infinite}
  @keyframes vol{from{transform:translate(-330px,120px) scale(.5)}to{transform:none}}
  @keyframes eclat{from{opacity:0}to{opacity:1}}
  @keyframes entre{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(255,106,31,.22),0 6px 18px rgba(255,106,31,.45)}50%{box-shadow:0 0 0 10px rgba(255,106,31,.10),0 6px 18px rgba(255,106,31,.45)}}
}

/* ===== v3 : verre dépoli, aurore, typographie large ===== */
[hidden]{display:none!important}
body{background:var(--bg);font-size:16.5px}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;opacity:var(--aur);pointer-events:none;filter:blur(50px);background:radial-gradient(38% 32% at 82% 12%,rgba(255,106,31,.42),transparent 70%),radial-gradient(44% 40% at 8% 58%,rgba(34,197,128,.26),transparent 70%),radial-gradient(40% 36% at 72% 96%,rgba(255,170,70,.20),transparent 70%)}
header.bar{background:var(--bar);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--line)}
header.bar h1{font-size:19px;font-weight:800;letter-spacing:0}
header.bar button{border-radius:99px}
h2{font-size:15px;font-weight:800;letter-spacing:.5px}
.pill{font-size:11px;letter-spacing:1.2px}
.card{border-radius:26px;padding:18px;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 18px 50px var(--shadow),inset 0 1px 0 rgba(255,255,255,.14)}
button{border-radius:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
button.primary{font-size:15px;font-weight:800;letter-spacing:.6px;border-radius:99px;min-height:58px;box-shadow:0 12px 34px rgba(255,106,31,.45),inset 0 1px 0 rgba(255,255,255,.45)}
input[type=text]{border-radius:18px}
/* accueil plein écran */
.hero{margin:0 -16px;border:none;border-radius:0 0 40px 40px;aspect-ratio:auto;height:min(66vh,540px);min-height:400px;padding:26px 22px 118px;background:linear-gradient(180deg,#0e3a2c 0%,#0a2a20 48%,#04100c 100%);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(180deg,transparent,rgba(3,9,7,.88));pointer-events:none}
.hero .wm{z-index:2;font-size:clamp(64px,21vw,112px);line-height:.9;letter-spacing:-3px;font-weight:900;text-shadow:none}
.hero .wm em{background:linear-gradient(95deg,#ff5a0a,#ffb35c);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
.hero .sub{z-index:2;font-size:12px;letter-spacing:3px;margin-top:6px;color:#c9d8cf}
.hero .pill{z-index:2;top:18px;left:20px;bottom:auto;right:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero + *{margin-top:-104px;position:relative;z-index:3}
.disc{gap:14px}
.disc button{border-radius:30px;padding:16px 16px 20px;min-height:200px;justify-content:flex-end;backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 24px 60px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25)}
.disc button::after{left:auto;right:14px;top:14px;bottom:auto;width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent)) center/100% no-repeat;box-shadow:0 8px 20px rgba(255,106,31,.5)}
.disc button::before{content:"→";position:absolute;right:14px;top:14px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;z-index:1;color:#1b0d04;font-weight:800;font-size:18px}
.disc svg{width:70%;margin:0 0 auto}
.disc b{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin-top:10px}
.disc span{font-size:13px}
.slot .n{font-size:16px;font-weight:800}
/* tir */
.postes{padding-top:6px}
.po b{font-size:16px;font-weight:800;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.now{border-radius:30px;padding:22px 20px 20px;backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 24px 60px var(--shadow),inset 0 1px 0 rgba(255,255,255,.22)}
.now::after{right:-40px;top:-40px;width:190px;height:190px;background:radial-gradient(circle at 40% 40%,rgba(255,150,60,.55),rgba(255,106,31,.12) 55%,transparent 70%);filter:blur(6px)}
.now .poste{font-size:12px;font-weight:800;letter-spacing:2.5px}
.now .nom{font-size:clamp(28px,9.2vw,44px);font-weight:900;letter-spacing:-1.5px;line-height:1.02;margin:6px 0 4px}
.shots{gap:12px}
.shots button{min-height:84px;border-radius:26px;font-size:19px}
.shots button b{font-size:38px;font-weight:900;letter-spacing:-1px}
.s1{background:linear-gradient(135deg,#7df0b0,#22c47a);box-shadow:0 14px 34px rgba(34,196,122,.38),inset 0 1px 0 rgba(255,255,255,.5)!important}
.s2{background:linear-gradient(135deg,#ffe08a,#ffb62e);box-shadow:0 14px 34px rgba(255,182,46,.36),inset 0 1px 0 rgba(255,255,255,.5)!important}
.s0{background:linear-gradient(135deg,#ff9a8f,#f24a3e);box-shadow:0 14px 34px rgba(242,74,62,.36),inset 0 1px 0 rgba(255,255,255,.45)!important}
.board .tot{font-size:19px;font-weight:800}
.m{border-radius:8px}
.flash{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-weight:900;font-size:min(46vw,260px);letter-spacing:-6px;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.flash.f1{background:radial-gradient(circle,rgba(34,196,122,.9),rgba(34,196,122,0) 72%)}
.flash.f2{background:radial-gradient(circle,rgba(255,182,46,.9),rgba(255,182,46,0) 72%)}
.flash.f0{background:radial-gradient(circle,rgba(242,74,62,.9),rgba(242,74,62,0) 72%)}
/* résultat */
.rank .rg{font-size:16px;font-weight:800}
.rank .sc{font-size:28px;font-weight:900;letter-spacing:-1px}
.rank .sc small{font-size:13px}
.rank.first{position:relative;overflow:hidden;border-radius:24px;padding:20px 16px;background:linear-gradient(135deg,rgba(255,150,60,.34),rgba(255,106,31,.08))}
.rank.first b{font-size:19px;letter-spacing:-.5px}
.rank.first .sc{font-size:46px}

<script id="core">
/* ---- Règles (sans DOM) ---- */
var NB = 25;
var MAXT = { DTL: 5, FU: 6 };
// i = index du tireur (0..), k = index du plateau de ce tireur (0..24)
function posteDe(disc, i, k) {
  if (disc === 'DTL') return ((i + Math.floor(k / 5)) % 5) + 1; // 5 plateaux par poste puis décalage à droite
  return (((i % 5) + k) % 5) + 1;                              // FU : on avance d'un poste après chaque tir
}
function pts(disc, r) { return disc === 'DTL' ? (r === 1 ? 3 : r === 2 ? 2 : 0) : (r ? 1 : 0); }
function maxPts(disc) { return disc === 'DTL' ? 75 : 25; }
function etat(s) {
  var N = s.tireurs.length, n = s.tirs.length, total = N * NB;
  var fini = n >= total, i = n % N, k = Math.floor(n / N);
  return { N: N, n: n, total: total, fini: fini, i: i, k: k,
    poste: fini ? 0 : posteDe(s.disc, i, k),
    rotation: s.disc === 'DTL' && !fini && n > 0 && n % (N * 5) === 0 && s.ack !== n };
}
function bilan(s) {
  var N = s.tireurs.length;
  return s.tireurs.map(function (t, i) {
    var marks = [], total = 0, casses = 0, premier = 0, series = [0, 0, 0, 0, 0];
    for (var k = 0; k < NB; k++) {
      var r = s.tirs[k * N + i];
      marks.push(r === undefined ? null : r);
      if (r === undefined) continue;
      var p = pts(s.disc, r); total += p; series[Math.floor(k / 5)] += p;
      if (r) casses++; if (r === 1) premier++;
    }
    return { i: i, nom: t.nom, marks: marks, total: total, casses: casses, premier: premier, series: series };
  });
}
function classement(s) {
  var b = bilan(s).slice().sort(function (a, c) { return c.total - a.total || a.i - c.i; });
  b.forEach(function (x, j) { x.rang = (j > 0 && b[j - 1].total === x.total) ? b[j - 1].rang : j + 1; });
  b.forEach(function (x) { x.exaequo = b.filter(function (y) { return y.rang === x.rang; }).length > 1; });
  return b;
}
function symb(disc, r) { return r === null || r === undefined ? '' : disc === 'DTL' ? String(pts('DTL', r)) : String(r); }
if (typeof module !== 'undefined') module.exports = { posteDe: posteDe, pts: pts, etat: etat, bilan: bilan, classement: classement, NB: NB };
</script>

<script>

  function resume(s) {
